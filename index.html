<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des Moules — Fanuc</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f4;
    --bg3: #eeecea;
    --text: #1a1a18;
    --text2: #6b6b67;
    --text3: #a0a09b;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --blue-bg: #e6f1fb;
    --blue-text: #185fa5;
    --blue-border: #85b7eb;
    --green-bg: #eaf3de;
    --green-text: #3b6d11;
    --green-border: #97c459;
    --red-bg: #fcebeb;
    --red-text: #a32d2d;
    --red-border: #f09595;
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c;
      --bg2: #2a2a27;
      --bg3: #333330;
      --text: #f0ede8;
      --text2: #a0a09b;
      --text3: #6b6b67;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --blue-bg: #0c447c;
      --blue-text: #b5d4f4;
      --blue-border: #378add;
      --green-bg: #27500a;
      --green-text: #c0dd97;
      --green-border: #639922;
      --red-bg: #791f1f;
      --red-text: #f7c1c1;
      --red-border: #e24b4a;
    }
  }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }
  .header { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 12px; }
  .header-icon { width: 36px; height: 36px; background: var(--blue-bg); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; }
  .header-icon svg { width: 20px; height: 20px; fill: var(--blue-text); }
  .header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
  .header p { font-size: 12px; color: var(--text2); }
  .container { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem; }
  .tabs { display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .tab { padding: 8px 16px; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 13px; cursor: pointer; background: var(--bg); color: var(--text2); transition: all 0.15s; font-family: inherit; }
  .tab:hover { background: var(--bg2); }
  .tab.active { background: var(--blue-bg); color: var(--blue-text); border-color: var(--blue-border); font-weight: 600; }
  .page { display: none; }
  .page.active { display: block; }
  .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
  .card-title { font-size: 10px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 1rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 12px; color: var(--text2); font-weight: 500; }
  select, input[type=text] { width: 100%; padding: 9px 11px; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 14px; background: var(--bg2); color: var(--text); font-family: inherit; outline: none; transition: border-color 0.15s; }
  select:focus, input[type=text]:focus { border-color: var(--blue-border); }
  .btn-primary { padding: 11px 20px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 4px; font-family: inherit; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { padding: 8px 14px; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 13px; cursor: pointer; background: var(--bg); color: var(--text2); font-family: inherit; transition: background 0.15s; }
  .btn-secondary:hover { background: var(--bg2); }
  .machine-card { background: var(--bg2); border-radius: var(--radius); padding: 1rem; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .machine-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .machine-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 4px 10px; border-radius: var(--radius); font-weight: 500; }
  .badge-on { background: var(--green-bg); color: var(--green-text); border: 0.5px solid var(--green-border); }
  .badge-off { background: var(--bg3); color: var(--text3); border: 0.5px solid var(--border); }
  .log-entry { padding: 11px 0; border-bottom: 0.5px solid var(--border); display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; align-items: start; }
  .log-entry:last-child { border-bottom: none; }
  .log-date { font-size: 11px; color: var(--text3); line-height: 1.6; }
  .log-text { font-size: 13px; color: var(--text); line-height: 1.6; }
  .log-note { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .log-tag { font-size: 11px; background: var(--bg2); color: var(--text2); padding: 2px 8px; border-radius: var(--radius); white-space: nowrap; border: 0.5px solid var(--border); }
  .mold-tag { display: inline-flex; align-items: center; gap: 4px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 4px 10px; font-size: 12px; color: var(--text2); margin: 3px; }
  .mold-tag button { background: none; border: none; cursor: pointer; color: var(--red-text); font-size: 15px; padding: 0 0 0 2px; line-height: 1; }
  .empty { text-align: center; padding: 2.5rem; color: var(--text3); font-size: 14px; }
  .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .add-row input { flex: 1; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: var(--radius); font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; border: 0.5px solid; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .config-machine-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .config-machine-row input { flex: 1; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .export-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .filter-btn { padding: 5px 12px; border: 0.5px solid var(--border2); border-radius: 20px; font-size: 12px; cursor: pointer; background: var(--bg); color: var(--text2); font-family: inherit; transition: all 0.15s; }
  .filter-btn.active { background: var(--blue-bg); color: var(--blue-text); border-color: var(--blue-border); font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
    </svg>
  </div>
  <div>
    <h1>Suivi des Moules</h1>
    <p>Fanuc 08 &nbsp;·&nbsp; Fanuc 09 &nbsp;·&nbsp; Fanuc 10</p>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="showPage('changement', this)">Enregistrer</button>
    <button class="tab" onclick="showPage('etat', this)">État des machines</button>
    <button class="tab" onclick="showPage('historique', this)">Historique</button>
    <button class="tab" onclick="showPage('config', this)">Configuration</button>
  </div>

  <!-- PAGE CHANGEMENT -->
  <div id="page-changement" class="page active">
    <div class="card">
      <div class="card-title">Nouveau changement de moule</div>
      <div class="form-row">
        <div class="form-group">
          <label>Machine</label>
          <select id="sel-machine" onchange="onMachineChange()"></select>
        </div>
        <div class="form-group">
          <label>Moule monté ↑</label>
          <select id="sel-monte"><option value="">— Sélectionner —</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Moule démonté ↓</label>
          <select id="sel-demonte"><option value="">— Aucun / déjà vide —</option></select>
        </div>
        <div class="form-group">
          <label>Note (optionnel)</label>
          <input type="text" id="inp-note" placeholder="Commentaire..." />
        </div>
      </div>
      <button class="btn-primary" onclick="enregistrerChangement()">✓ Enregistrer le changement</button>
    </div>
  </div>

  <!-- PAGE ÉTAT -->
  <div id="page-etat" class="page">
    <div class="card">
      <div class="card-title">État actuel des machines</div>
      <div id="etat-machines"></div>
    </div>
  </div>

  <!-- PAGE HISTORIQUE -->
  <div id="page-historique" class="page">
    <div class="card">
      <div class="export-bar">
        <div class="card-title" style="margin-bottom:0;">Journal des opérations</div>
        <button class="btn-secondary" onclick="exporterExcel()">⬇ Exporter .xlsx</button>
      </div>
      <div class="filter-row" id="filter-btns"></div>
      <div id="liste-historique"></div>
    </div>
  </div>

  <!-- PAGE CONFIG -->
  <div id="page-config" class="page">
    <div class="card">
      <div class="card-title">Noms des machines</div>
      <div id="config-machines"></div>
    </div>
    <div class="card">
      <div class="card-title">Liste des moules</div>
      <div class="add-row">
        <input type="text" id="inp-nouveau-moule" placeholder="Nom du moule..." onkeydown="if(event.key==='Enter')ajouterMoule()" />
        <button class="btn-secondary" onclick="ajouterMoule()">+ Ajouter</button>
      </div>
      <div id="liste-moules"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT = {
  machines: [
    { id: 1, nom: "Fanuc 08", mouleActuel: null },
    { id: 2, nom: "Fanuc 09", mouleActuel: null },
    { id: 3, nom: "Fanuc 10", mouleActuel: null }
  ],
  moules: [],
  historique: []
};

let state;
try {
  const d = localStorage.getItem('suivi_moules_fanuc');
  state = d ? JSON.parse(d) : JSON.parse(JSON.stringify(DEFAULT));
} catch(e) {
  state = JSON.parse(JSON.stringify(DEFAULT));
}

let filtreActif = 'tous';

function save() {
  try { localStorage.setItem('suivi_moules_fanuc', JSON.stringify(state)); } catch(e) {}
}

function showPage(p, btn) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  if (btn) btn.classList.add('active');
  const renders = { etat: renderEtat, historique: renderHistorique, config: renderConfig, changement: renderFormulaire };
  if (renders[p]) renders[p]();
}

function renderFormulaire() {
  const sm = document.getElementById('sel-machine');
  const smo = document.getElementById('sel-monte');
  const sde = document.getElementById('sel-demonte');
  sm.innerHTML = state.machines.map(m => `<option value="${m.id}">${m.nom}</option>`).join('');
  const opts = state.moules.map(m => `<option value="${m}">${m}</option>`).join('');
  smo.innerHTML = '<option value="">— Sélectionner —</option>' + opts;
  sde.innerHTML = '<option value="">— Aucun / déjà vide —</option>' + opts;
  onMachineChange();
}

function onMachineChange() {
  const id = parseInt(document.getElementById('sel-machine').value);
  const m = state.machines.find(x => x.id === id);
  document.getElementById('sel-demonte').value = (m && m.mouleActuel) ? m.mouleActuel : '';
}

function enregistrerChangement() {
  const machineId = parseInt(document.getElementById('sel-machine').value);
  const monte = document.getElementById('sel-monte').value;
  const demonte = document.getElementById('sel-demonte').value;
  const note = document.getElementById('inp-note').value.trim();
  if (!monte) { showToast('Sélectionnez le moule monté', true); return; }
  const machine = state.machines.find(m => m.id === machineId);
  const now = new Date();
  state.historique.unshift({
    id: Date.now(),
    date: now.toLocaleDateString('fr-FR'),
    heure: now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
    machineId,
    machineNom: machine.nom,
    monte,
    demonte: demonte || '',
    note
  });
  machine.mouleActuel = monte;
  save();
  document.getElementById('sel-monte').value = '';
  document.getElementById('inp-note').value = '';
  onMachineChange();
  showToast('Changement enregistré');
}

function renderEtat() {
  document.getElementById('etat-machines').innerHTML = state.machines.map(m => `
    <div class="machine-card">
      <div>
        <div class="machine-name">${m.nom}</div>
        <div class="machine-sub">Moule en cours</div>
      </div>
      ${m.mouleActuel
        ? `<span class="badge badge-on"><span class="dot"></span>${m.mouleActuel}</span>`
        : `<span class="badge badge-off">Vide</span>`}
    </div>`).join('');
}

function renderHistorique() {
  const btns = document.getElementById('filter-btns');
  btns.innerHTML = `
    <button class="filter-btn ${filtreActif === 'tous' ? 'active' : ''}" onclick="setFiltre('tous')">Toutes</button>
    ${state.machines.map(m => `<button class="filter-btn ${filtreActif === m.id ? 'active' : ''}" onclick="setFiltre(${m.id})">${m.nom}</button>`).join('')}`;
  const c = document.getElementById('liste-historique');
  let data = state.historique;
  if (filtreActif !== 'tous') data = data.filter(e => e.machineId === filtreActif);
  if (!data.length) { c.innerHTML = '<div class="empty">Aucun changement enregistré</div>'; return; }
  c.innerHTML = data.map(e => `
    <div class="log-entry">
      <div class="log-date">${e.date}<br>${e.heure}</div>
      <div>
        <div class="log-text"><strong>${e.machineNom}</strong> — monté : <strong>${e.monte}</strong>${e.demonte ? ` · démonté : <em>${e.demonte}</em>` : ''}</div>
        ${e.note ? `<div class="log-note">${e.note}</div>` : ''}
      </div>
      <span class="log-tag">${e.machineNom}</span>
    </div>`).join('');
}

function setFiltre(id) {
  filtreActif = id;
  renderHistorique();
}

function renderConfig() {
  document.getElementById('config-machines').innerHTML = state.machines.map(m => `
    <div class="config-machine-row">
      <input type="text" value="${m.nom}" onchange="renommerMachine(${m.id}, this.value)" />
    </div>`).join('');
  const lm = document.getElementById('liste-moules');
  lm.innerHTML = !state.moules.length
    ? '<div class="empty" style="padding:1rem;">Aucun moule — ajoutez-les ci-dessus</div>'
    : state.moules.map((m, i) => `
      <span class="mold-tag">${m}
        <button onclick="supprimerMoule(${i})">×</button>
      </span>`).join('');
}

function ajouterMoule() {
  const inp = document.getElementById('inp-nouveau-moule');
  const nom = inp.value.trim();
  if (!nom) return;
  if (state.moules.includes(nom)) { showToast('Ce moule existe déjà', true); return; }
  state.moules.push(nom);
  inp.value = '';
  save();
  renderConfig();
  showToast(`"${nom}" ajouté`);
}

function supprimerMoule(i) {
  const nom = state.moules[i];
  state.moules.splice(i, 1);
  save();
  renderConfig();
  showToast(`"${nom}" supprimé`);
}

function renommerMachine(id, newNom) {
  const m = state.machines.find(x => x.id === id);
  if (m) { m.nom = newNom; save(); }
}

function exporterExcel() {
  if (!state.historique.length) { showToast('Aucune donnée à exporter', true); return; }
  const wb = XLSX.utils.book_new();
  state.machines.forEach(machine => {
    const rows = state.historique.filter(e => e.machineId === machine.id).sort((a, b) => a.id - b.id);
    const data = [['Date', 'Heure', 'Moule monté', 'Moule démonté', 'Note']];
    rows.forEach(r => data.push([r.date, r.heure, r.monte, r.demonte || '', r.note || '']));
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{ wch: 12 }, { wch: 10 }, { wch: 22 }, { wch: 22 }, { wch: 32 }];
    XLSX.utils.book_append_sheet(wb, ws, machine.nom);
  });
  XLSX.writeFile(wb, `suivi_moules_${new Date().toLocaleDateString('fr-FR').replace(/\//g,'_')}.xlsx`);
  showToast('Fichier Excel téléchargé');
}

function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = err ? 'var(--red-bg)' : 'var(--green-bg)';
  t.style.color = err ? 'var(--red-text)' : 'var(--green-text)';
  t.style.borderColor = err ? 'var(--red-border)' : 'var(--green-border)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

renderFormulaire();
</script>
</body>
</html>
